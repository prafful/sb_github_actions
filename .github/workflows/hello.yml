name: Spring Boot CI

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

jobs:
  build:

    runs-on: ubuntu-latest

    services:

      mysql:

        image: mysql:8.4

        env:
          MYSQL_ROOT_PASSWORD: n3u3da!
          MYSQL_DATABASE: friends_community

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h localhost -pn3u3da!"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Make Maven Wrapper Executable
        run: chmod +x mvnw

      - name: Build and Run Tests
        env:
          DB_URL: jdbc:mysql://localhost:3306/friends_community
          DB_USERNAME: root
          DB_PASSWORD: n3u3da!
        run: ./mvnw clean verify

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: spring-boot-jar
          path: target/*.jar